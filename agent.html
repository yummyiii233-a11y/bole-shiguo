<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伯乐识果 · 转化智能体</title>
<style>
:root { color-scheme: light; font: 16px/1.55 system-ui, sans-serif; background: #fdfdfd; color: #171717; }
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(calc(100% - 32px), 740px); min-height: 100svh; margin: auto; display: flex; flex-direction: column; padding: 20px 0; }
header, .actions, .review-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header { margin-bottom: 20px; }
.chat-stage { flex: 1; display: flex; flex-direction: column; }
.chat-stage:not(:has(article)) { justify-content: center; }
h1 { text-align: center; font-size: clamp(27px, 5vw, 42px); font-weight: 600; margin: 0 0 clamp(18px, 4vw, 40px); }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button, summary { cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid #536c9a; outline-offset: 2px; }
#reset, .example-menu button, #password { border: 1px solid #ddd; background: #fff; border-radius: 12px; padding: 8px 12px; }
#conversation:not(:empty) { display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px; }
article{display:flex;flex-direction:column;align-self:flex-start;max-width:min(88%,560px);min-width:0}
article[data-role=user]{align-self:flex-end}
.message-meta{display:flex;align-items:center;gap:6px;padding:0 14px;color:#666;font-size:.75rem;font-variant-numeric:tabular-nums}
.message-meta strong{font-weight:600}
.message-meta .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.65}
.message-bubble{background:#f4f4f4;border-radius:16px 16px 16px 5px;padding:10px 14px;margin:4px 0}
article[data-role=user] .message-bubble{background:#eceef1;border-radius:16px 16px 5px 16px}
article[data-role=user] .message-meta{align-self:flex-end}
.message-bubble p{white-space:pre-wrap;overflow-wrap:anywhere;color:inherit;margin:0}
.message-bubble ul{margin:4px 0 0;padding-inline-start:18px;overflow-wrap:anywhere}
.message-bubble small{display:block;margin-top:12px}

.composer { border: 1px solid #dedede; background: #fff; border-radius: clamp(24px, 4vw, 36px); padding: 14px clamp(12px, 3vw, 22px); box-shadow: 0 2px 6px #00000018; }
.composer:focus-within { border-color: #9a9a9a; }
textarea { display: block; width: 100%; min-height: 64px; resize: vertical; padding: 8px; border: 0; outline: none; background: transparent; font-size: clamp(16px, 3vw, 22px); }
.examples { position: relative; }
summary { line-height: 44px; padding-inline: 12px; border-radius: 999px; }
summary:hover { background: #f2f2f2; }
.example-menu { position: absolute; bottom: calc(100% + 8px); left: 0; display: grid; gap: 4px; width: max-content; max-width: calc(100vw - 68px); padding: 6px; background: white; border: 1px solid #ddd; border-radius: 14px; box-shadow: 0 4px 18px #0001; }
#send { display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; color: white; background: #171717; }
#send:disabled, .composer:has(textarea:placeholder-shown) #send { background: #737373; }
.review-controls { flex-wrap: wrap; justify-content: flex-start; margin-top: 14px; color: #555; font-size: 14px; }
#password { width: min(160px, 100%); }
#status { color: #555; min-height: 1.55em; margin: 6px 0 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>


</head>
<body>
<main>
<header><a href="./">伯乐识果 ↗</a><button id="reset" type="button">新对话</button></header>
<section class="chat-stage" aria-labelledby="chat-title">
<h1 id="chat-title">成果转化智能体</h1>
<section id="conversation" aria-label="对话" role="log"></section>
<form id="chat">
<div class="composer">
<label class="sr-only" for="question">你的问题</label>
<textarea id="question" rows="2" maxlength="2000" required placeholder="输入消息…"></textarea>
<div class="actions">
<details class="examples"><summary>工具</summary><div class="example-menu">
<button type="button" data-prompt="分析 CN-101862211-B 的转化准备度。解释规则评分能说明什么，并列出与医疗器械企业对接前应核验的事项。">专利潜力分析</button>
<button type="button" data-prompt="对照企业需求 EQ-001，评估硅基光电探测器 CN-101719504-B 是否适合激光传感器方向。分开写可能匹配点、指标缺口和下一步。">企业需求匹配</button>
<button type="button" data-prompt="为水中氚快速自动分析专利 CN-109444944-B 拟定从样机验证到试点合作的路径，每个阶段写出进入下一阶段的条件。">转化路径建议</button>
</div></details>
<button id="send" type="submit" aria-label="发送问题"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button>
</div>
</div>
<div class="review-controls">
<label for="password">评审口令 <small>账号 reviewer</small></label>
<input id="password" type="password" required autocomplete="current-password">
</div>
<p id="status" role="status"></p>
</form>
</section>
</main>
<script src="chat-ui.js?v=1"></script>

<script>
const toolsMenu = document.querySelector('.examples');
const chatInput = document.querySelector('#question');
const sendButton = document.querySelector('#send');

function updateSendButton() {
  sendButton.disabled = chatInput.readOnly || !chatInput.value.trim();
}

chatInput.addEventListener('input', updateSendButton);
document.querySelector('#reset').addEventListener('click', updateSendButton);
toolsMenu.addEventListener('click', event => {
  if (event.target.closest('[data-prompt]')) {
    toolsMenu.open = false;
    updateSendButton();
  }
});
new MutationObserver(updateSendButton).observe(chatInput, {
  attributes: true,
  attributeFilter: ['readonly']
});
updateSendButton();
</script>
</body>
</html>
