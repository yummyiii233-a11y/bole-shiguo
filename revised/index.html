        <li><div><time>2010年</time><h3>技术研发与专利形成</h3><p>陈政清院士团队研发电涡流阻尼技术，用电磁感应耗散振动能量，并形成系列专利。</p></div></li>
        <li><div><time>2016年</time><h3>首次转让及应用</h3><p>相关专利以20万元转让，技术随后应用于上海中心大厦等工程。</p></div></li>
        <li><div><time>2019年起</time><h3>专利梳理和市场对接</h3><p>湖南大学梳理关键专利，形成技术组合，并与投资机构对接。</p></div></li>
        <li><div><time>2021年</time><h3>作价入股</h3><p>湖南大学将12项专利权和18项专利申请权作价1.0005亿元参与企业增资。</p></div></li>
        <li><div><time>2022—2024年</time><h3>企业推广及收入</h3><p>据国家知识产权局2024年报道，技术已应用于120多项工程。企业2022年和2023年营收分别为1200万元和2100万元。</p></div></li>
