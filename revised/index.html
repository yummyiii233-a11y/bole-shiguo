  <div class="bole-timeline-sticky">
    <h2 id="bole-timeline-title">湖南大学电涡流阻尼技术</h2>
    <div class="bole-timeline-window" tabindex="0" aria-label="专利转化时间轴">
      <ol class="bole-timeline-track">
        <li><div><time>2010年</time><h3>技术研发与专利形成</h3><p><strong>从桥梁和大型建筑的减振难题出发。</strong>陈政清院士团队研发出电涡流阻尼新技术，利用电磁感应耗散振动能量，并围绕技术形成系列专利。科研成果有了走向工程应用的基础。</p></div></li>
        <li><div><time>2016年</time><h3>首次转让及应用</h3><p><strong>20万元，让技术第一次进入市场。</strong>团队将相关专利转让给企业。此后，电涡流阻尼器应用于上海中心大厦等工程。早期交易带来了实际应用验证，也让团队看到技术尚有更大的转化空间。</p></div></li>
        <li><div><time>2019年起</time><h3>专利梳理和市场对接</h3><p><strong>把分散的专利，整理成可合作的技术组合。</strong>湖南大学科技成果转化中心与团队梳理关键专利、形成分析报告，并对接投资机构，讨论应用场景和合作方式。技术价值开始从单项专利，走向系统化运营。</p></div></li>
        <li><div><time>2021年</time><h3>作价入股</h3><p><strong>专利组合成为企业发展的出资。</strong>湖南大学将12项专利权和18项专利申请权组成科技成果，作价 1.0005亿元参与企业增资。这里的金额是成果作价，不是学校收到的现金。</p></div></li>
        <li><div><time>2022—2024年</time><h3>企业推广及收入</h3><p><strong>转化没有停在交易完成的那一刻。</strong>企业继续推广技术。国家知识产权局2024年的案例报道显示，该成果已应用于120多项工程；报道援引企业数据称，2022年营收1200万元，2023年营收2100万元。技术通过持续应用产生了经营成果。</p></div></li>
      </ol>
    </div>
    <p class="bole-timeline-close">一项科研成果的价值，经过工程验证、专利运营与企业推广，才逐步被看见。</p>
